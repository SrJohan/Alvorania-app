# /etc/nginx/sites-available/alvorania.gestoriainnova.com
# Demo protegida de dos formas:
#  · Enlace por persona o empresa: https://alvorania.gestoriainnova.com/?acceso=CÓDIGO deja una cookie y entra sin contraseña.
#    Los códigos viven en /etc/nginx/alvorania-enlaces.map («código nombre;») y se gestionan con alvorania-enlace (enlace.sh).
#  · Equipo: usuario y contraseña de /etc/nginx/.htpasswd-alvorania, como prueba.gestoriainnova.com.
# Requiere el certificado ya emitido (certbot certonly --nginx -d alvorania.gestoriainnova.com) en una instalación nueva.

# Código → nombre. Vale tanto el de la URL (primera visita) como el de la cookie (las siguientes).
map $arg_acceso $alv_enlace_url {
    default "";
    include /etc/nginx/alvorania-enlaces.map;
}
map $cookie_alv_acceso $alv_enlace_cookie {
    default "";
    include /etc/nginx/alvorania-enlaces.map;
}
# Con cookie válida no se pide contraseña ("off"); sin ella, usuario y contraseña del equipo.
map $alv_enlace_cookie $alv_auth {
    ""      "Demo de Alvorania";
    default off;
}
# Quién ha entrado: la empresa del enlace o, si no, el usuario del equipo.
map $alv_enlace_cookie $alv_quien {
    ""      $remote_user;
    default $alv_enlace_cookie;
}
log_format alv_demo '$time_iso8601 quien=$alv_quien ip=$remote_addr "$request" $status';

server {
    server_name alvorania.gestoriainnova.com;
    client_max_body_size 21m;
    access_log /var/log/nginx/alvorania-demo.log alv_demo;

    auth_basic $alv_auth;
    auth_basic_user_file /etc/nginx/.htpasswd-alvorania;

    include /etc/nginx/snippets/seguridad-cabeceras-web.conf;
    # Es una demo: que no aparezca en buscadores.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        # Primera visita con ?acceso=CÓDIGO válido: guarda la cookie 14 días y quita el código de la barra de direcciones.
        # (Esta fase va antes que la contraseña, así que el enlace nunca ve la ventana de usuario y contraseña.)
        if ($alv_enlace_url != "") {
            add_header Set-Cookie "alv_acceso=$arg_acceso; Path=/; Max-Age=1209600; Secure; HttpOnly; SameSite=Lax" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            return 302 $uri;
        }
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/alvorania.gestoriainnova.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/alvorania.gestoriainnova.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = alvorania.gestoriainnova.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name alvorania.gestoriainnova.com;
    listen 80;
    return 404; # managed by Certbot
}
